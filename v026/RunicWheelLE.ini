[BindingsV2]

; F2/F3/F4/F5 (including Skyrim quicksave) are passed through unchanged.
; SlowTimePercent=100 switches off slowdown.
; Set EnableSafeInventoryUITask=0 to isolate a menu-related CTD; slowdown stays enabled.
; Set EnableSpellActions=0 to disable only experimental spell equip while keeping normal item actions.
; Set EnableNativeActions=0 to keep this build entirely catalog-only if native actions fail.
; A tempered/enchanted/renamed copy that was sold or dropped is refused, never swapped for another.
; Four original RWAT atlases in Data\SKSE\Plugins: RunicWheelIcons.rwtx (32 independent heraldic symbols), RunicWheelFrame.rwtx (ornaments), RunicWheelFont.rwtx (Unicode bitmap glyphs), RunicWheelPlaque.rwtx (nameplate). No Wheeler assets or source.

; ShowItemNames=0 disables the optional game-thread TESForm name cache.
; Missing/unavailable labels fall back to category symbols/FormID; actions remain unchanged.
