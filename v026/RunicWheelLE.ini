; RUNIC WHEEL LE - v0.26.0 EXACT ITEMS, SHOUTS, POWERS, SCROLLS, INGREDIENTS
; Copyright (c) 2026 Mhacks79. Original implementation. No Wheeler assets.
; Skyrim Legendary Edition 1.9.32.0.8 + SKSE 1.7.3.
;
; Hover an item in Inventory/Magic, click MIDDLE to open the wheel.
; Move mouse to a sector, LEFT CLICK to add (and stack), RIGHT CLICK to remove.
; Scroll mouse wheel to select among multiple items in a sector.
; The wheel slows time outside Inventory and Magic. Menu context is detected via SKSE events.
; Inventory hover capture is isolated pending a verified safe UI integration.
; Menu capture is on SKSE UI task queue; no Render detours. v0.10/v0.11.2 game-tested.
; There are NO F2/F3/F4/F5 editor keys. Reserved function keys are never intercepted.
; Native item/spell routes are inherited unchanged from player-validated v0.11.2.
; v0.12.1 enlarges emblems/text and corrects base+delta ownership counting.
; Ingredients are eaten through the same EquipManager call as the vanilla inventory.
; Shouts, powers and scrolls equip like in the Magic and Inventory menus.
; Tempered, enchanted or renamed weapons and armor: the wheel keeps the exact copy
; you hovered. Only weapons, armor, ammo, potions, food, poisons, ingredients,
; torches, scrolls, spells, powers and shouts can be added.
; Torch support is experimental, limited to TESObjectLIGH owned base records.
; Do not use the private build on your main save until game-validated.
; Visual confirmation lasts ClickFeedbackMs: ADDED/REMOVED/EQUIP/UNEQUIP/USED/REFUSED.
;
; Mouse button IDs: 0=left, 1=right, 2=middle, 3/4=side; wheel up/down=8/9.
; Original dTry gamepad defaults use raw SKSE LE masks: LT=9 to open, RT=10 next wheel,
; RB=512 primary, LB=256 secondary, DPAD left=4 previous item, DPAD right=8 next item.
; Refined changes its default open input to X (16384); see docs/INPUT-PARITY-AUDIT.md.
; KeyboardLayoutMode: 2=automatic physical positions (AZERTY A/E, QWERTY Q/E);
; 3=legacy literal Q/E via Windows layout, 1=explicit physical scan codes, 0=explicit;
; 1=physical scan codes, 0=explicit codes.
[Controls]
OpenMouseButton=2
OpenKeyboardScanCode=0
HoldThresholdMs=260
MouseSensitivityPercent=100
MouseDeadzone=22
; v0.24 KHA-OS control centre. Visible capacity may be reduced but remains
; bounded by RWL2 fixed 3 pages, 8 sectors, 4 items per sector. Hidden entries
; are retained in the existing per-save co-save and restored when unhidden.
VisiblePageCount=3
VisibleSectorCount=8
WheelOffsetXPercent=0
WheelOffsetYPercent=0
IconSizePercent=100
TextScalePercent=100
; RGB highlight and background opacity are controlled by KHA-OS palettes.
AccentRed=219
AccentGreen=186
AccentBlue=125
BackgroundStrengthPercent=88
ShowDecorativeFrame=1
WheelScalePercent=130
WheelOpacityPercent=70
ShowItemNames=1
ShowSectorLabels=0
; Optional per-sector text; default off for an uncluttered radial menu.
; Selected item always has its full name in the larger bottom plaque.
ShowConceptIcons=1
; ShowConceptIcons is retained for backward compatibility with old V0.13 INIs.
; If any atlas is unavailable, the corresponding render layer fails safely.
ClickFeedbackMs=900
; 0.16 presentation-only effects, independent of native actions and input timing.
; All durations are real-time milliseconds. 0 disables an individual transition.
; ReduceMotion removes scaling and sector crossfade while retaining gentle opacity fades.
EnablePresentationAnimations=1
ReduceMotion=0
OpenAnimationMs=160
CloseAnimationMs=110
SectorTransitionMs=125
EnableNativeActions=1
EnableSpellActions=1
SlowTimePercent=10
EnableSafeInventoryUITask=1
PrimaryMouseButton=0
SecondaryMouseButton=1
; In world: left click equips RIGHT hand, right click equips LEFT hand.
; Inventory/Magic editor is unchanged (left add, right remove).
LeftClickEquipsRightHand=1
; Verbose diagnostic logging is optional after play validation.
EnableInputDiagnostics=0
; Normal wheel cycles stacked objects; ReverseItemScroll=1 inverts scroll direction.
ReverseItemScroll=0
; Optional physical scan-code shortcuts to cycle stacked entries.
; 0 disables them, so the vanilla keyboard mapping is preserved by default.
PreviousItemScanCode=0
NextItemScanCode=0
; Optional physical scan codes: jump to the previous/next OCCUPIED sector.
; These skip empty sectors without triggering equipment actions. 0 = disabled.
PreviousOccupiedSectorScanCode=0
NextOccupiedSectorScanCode=0
; Show a miniature medallion of the following item + its name in the nameplate.
ShowNextItemPreview=1
; 1=show mini previews in EVERY stacked sector, 0=only highlighted sector.
ShowAllStackPreviews=1
; Tiny gold progress markers under miniature previews.
ShowStackPositionDots=1
; Adds a school-specific jewel-coloured underline to magical medallions.
ShowMagicSchoolAccents=1
; Optional labels shown above the wheel; customise freely (max 23 ASCII chars).
ShowWheelTitles=1
Wheel1Title=WHEEL I
Wheel2Title=WHEEL II
Wheel3Title=WHEEL III
; Subtle progress strokes mark the selected item in a stacked sector.
ShowStackHints=1
; Advanced editor operates ONLY with Inventory/Magic open and radial wheel visible.
; Plain LMB add / RMB remove stay unchanged; in-world equipment is unaffected.
; Modifier combinations use PHYSICAL Shift / Ctrl / Alt on AZERTY and QWERTY.
; SHIFT+LMB: arm MOVE of selected item, then SHIFT+LMB a target sector (also across wheels).
; CTRL+LMB: arm COPY, then CTRL+LMB target; full or duplicate targets are refused.
; SHIFT+ALT+LMB: arm SWAP of whole source/target sectors (each up to four items).
; SHIFT+CTRL+LMB: arm CLONE of source sector; target must be empty.
; ALT+LMB: move current item one position forward INSIDE its current sector.
; SHIFT+RMB: undo; CTRL+RMB: redo (eight edits of history).
; ALT+RMB twice on same sector in 1750ms: safely clear entire stack (undoable).
; Close wheel or load a save to cancel pending transfer; all changes are per-save.
EnableAdvancedEditorGestures=1
ShowAdvancedEditorGuide=1
; The larger help panel is visible ONLY while Inventory or Magic is open.
ShowWheelControlsPanel=1
; The controls panel is also Inventory/Magic-only and can be hidden independently.
; Normal gameplay NEVER displays helper panels, even if an old INI
; retains ShowControlsGuide=1 from v0.22 (ignored for compatibility).
ShowWheelOccupancy=1
; Optional direct sector selection: upper keyboard row physical positions 1..8.
; Works on AZERTY (same key positions, different printed characters).
; Disabled by default to avoid stealing vanilla hotkey slots.
EnableQuickSectorKeys=0
; Extra advanced editor gestures (Inventory/Magic context only):
; ALT + mouse wheel reorders stack entries rather than simply selecting them.
; CTRL+ALT+Q/E clones the CURRENT whole wheel into the adjacent EMPTY wheel.
; SHIFT+ALT+Q/E swaps all sectors between two whole wheels (reversible).
; SHIFT+ALT+RMB twice on same wheel within 1750ms clears the whole wheel (undoable).
CycleEntryUpMouseCode=8
CycleEntryDownMouseCode=9
CloseKeyboardScanCode=1
; KHA-OS panel pointer: 0=off, 1=draw one only while the Windows pointer is hidden
; (some overlays hide it), 2=always draw one.
KhaosCursorMode=1
ConsumeInputWhileOpen=1
PreviousWheelMouseButton=3
NextWheelMouseButton=4
KeyboardLayoutMode=2
PreviousWheelScanCode=16
NextWheelScanCode=18
EnableGamepad=1
GamepadOpenMask=9
GamepadPreviousMask=0
GamepadNextMask=10
GamepadRightStickMask=12
GamepadPreviousItemMask=4
GamepadNextItemMask=8
GamepadPrimaryMask=512
GamepadSecondaryMask=256
GamepadDeadzonePercent=22

